<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RentReady Vision — Day 1–3 Prototype</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 14px; padding: 20px; margin: 18px 0; }
    button { padding: 10px 16px; cursor: pointer; }
    pre { background: #f5f5f5; padding: 14px; border-radius: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>RentReady Vision</h1>
  <p>Day 1–3 prototype: upload a property walkthrough and extract useful OpenCV keyframes.</p>
  <div class="card">
    <input id="property" placeholder="Property label (optional)" />
    <input id="file" type="file" accept="video/mp4,video/quicktime,.mp4,.mov" />
    <button id="run">Upload and analyze</button>
  </div>
  <div class="card"><strong>Status</strong><pre id="status">Ready.</pre></div>
<script>
const statusEl = document.getElementById("status");
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function api(path, options={}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json", ...(options.headers || {})}, ...options});
  if (!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
  return r.json();
}
document.getElementById("run").onclick = async () => {
  const file = document.getElementById("file").files[0];
  if (!file) return alert("Choose an MP4 or MOV video first.");
  try {
    statusEl.textContent = "Creating inspection...";
    const inspection = await api("/inspections", {method: "POST", body: JSON.stringify({property_label: document.getElementById("property").value || null, purpose: "rental_prep"})});
    const id = inspection.inspection_id;
    statusEl.textContent = "Creating secure S3 upload URL...";
    const upload = await api(`/inspections/${id}/upload-url`, {method: "POST", body: JSON.stringify({filename: file.name, content_type: file.type || "video/mp4"})});
    statusEl.textContent = "Uploading directly to S3...";
    const put = await fetch(upload.upload_url, {method: "PUT", headers: upload.required_headers, body: file});
    if (!put.ok) throw new Error(`S3 upload failed: ${put.status}`);
    await api(`/inspections/${id}/upload-complete`, {method: "POST", body: JSON.stringify({filename: file.name, content_type: file.type || "video/mp4"})});
    statusEl.textContent = "Starting OpenCV processing...";
    await api(`/inspections/${id}/process`, {method: "POST"});
    for (;;) {
      const st = await api(`/inspections/${id}/status`);
      statusEl.textContent = JSON.stringify(st, null, 2);
      if (st.status === "COMPLETE" || st.status === "FAILED") break;
      await sleep(1500);
    }
    const final = await api(`/inspections/${id}/status`);
    if (final.status === "COMPLETE") {
      const frames = await api(`/inspections/${id}/frames`);
      statusEl.textContent += "\n\n" + JSON.stringify(frames, null, 2);
    }
  } catch (e) { statusEl.textContent = String(e); }
};
</script>
</body>
</html>
