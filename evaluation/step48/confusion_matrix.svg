<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <style>
    .title { font: bold 32px Arial, sans-serif; fill: #111; }
    .subtitle { font: 20px Arial, sans-serif; fill: #444; }
    .axis { font: bold 22px Arial, sans-serif; fill: #222; }
    .celltitle { font: bold 32px Arial, sans-serif; fill: #111; }
    .cellvalue { font: bold 50px Arial, sans-serif; fill: #111; }
    .metrics { font: 18px Arial, sans-serif; fill: #222; }
  </style>

  <rect width="1000" height="760" fill="white"/>

  <text x="500" y="55" text-anchor="middle" class="title">
    Step 48 — Detector v4 Untouched Holdout
  </text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">
    Confusion Matrix — 18 videos
  </text>

  <text x="465" y="140" text-anchor="middle" class="axis">Predicted Defect</text>
  <text x="735" y="140" text-anchor="middle" class="axis">Predicted Clean</text>

  <text x="235" y="285" text-anchor="middle" class="axis">Actual Defect</text>
  <text x="235" y="505" text-anchor="middle" class="axis">Actual Clean</text>

  <!-- TP -->
  <rect x="330" y="165" width="270" height="220" fill="#d9ead3" stroke="#444" stroke-width="3"/>
  <text x="465" y="255" text-anchor="middle" class="celltitle">True Positive</text>
  <text x="465" y="325" text-anchor="middle" class="cellvalue">8</text>

  <!-- FN -->
  <rect x="600" y="165" width="270" height="220" fill="#f4cccc" stroke="#444" stroke-width="3"/>
  <text x="735" y="255" text-anchor="middle" class="celltitle">False Negative</text>
  <text x="735" y="325" text-anchor="middle" class="cellvalue">1</text>

  <!-- FP -->
  <rect x="330" y="385" width="270" height="220" fill="#f4cccc" stroke="#444" stroke-width="3"/>
  <text x="465" y="475" text-anchor="middle" class="celltitle">False Positive</text>
  <text x="465" y="545" text-anchor="middle" class="cellvalue">0</text>

  <!-- TN -->
  <rect x="600" y="385" width="270" height="220" fill="#d9ead3" stroke="#444" stroke-width="3"/>
  <text x="735" y="475" text-anchor="middle" class="celltitle">True Negative</text>
  <text x="735" y="545" text-anchor="middle" class="cellvalue">9</text>

  <text x="500" y="660" text-anchor="middle" class="metrics">
    Precision 100.0% | Recall 88.9% | Specificity 100.0%
  </text>
  <text x="500" y="695" text-anchor="middle" class="metrics">
    Accuracy 94.4% | F1 94.1%
  </text>
</svg>
